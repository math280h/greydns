name: Security

on:
  push:
  pull_request:
  schedule:
    # Weekly rerun catches newly-published CVEs against unchanged code.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    name: Semgrep
    steps:
      - name: 🔔 Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: 🔎 semgrep scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
            semgrep scan \
              --config p/default \
              --config p/golang \
              --config p/secrets \
              --sarif --output=/src/semgrep.sarif \
              --error

      - name: ⬆️ Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.36.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  govulncheck:
    runs-on: ubuntu-latest
    name: govulncheck
    steps:
      - name: 🔔 Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: 🔧 Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'

      - name: 🔎 govulncheck
        uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee # v1.0.4
        with:
          go-version-input: '1.26'
          go-package: ./...
          repo-checkout: false

  grype:
    runs-on: ubuntu-latest
    name: Grype
    steps:
      - name: 🔔 Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: 🔧 Setup Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: 🐳 Build image locally
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: greydns:scan

      - name: 🔎 Grype scan
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: greydns:scan
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      - name: ⬆️ Upload SARIF
        if: always() && steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.36.2
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype
