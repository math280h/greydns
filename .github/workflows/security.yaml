name: Security

on:
  push:
  pull_request:
  schedule:
    # Weekly rerun catches newly-published CVEs against unchanged code.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    name: Semgrep
    steps:
      - name: 🔔 Checkout Code
        uses: actions/checkout@v6

      - name: 🔎 semgrep scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
            semgrep scan \
              --config p/default \
              --config p/golang \
              --config p/secrets \
              --sarif --output=/src/semgrep.sarif \
              --error

      - name: ⬆️ Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  govulncheck:
    runs-on: ubuntu-latest
    name: govulncheck
    steps:
      - name: 🔔 Checkout Code
        uses: actions/checkout@v6

      - name: 🔧 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: 🔎 govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.26'
          go-package: ./...

  grype:
    runs-on: ubuntu-latest
    name: Grype
    steps:
      - name: 🔔 Checkout Code
        uses: actions/checkout@v6

      - name: 🔧 Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: greydns:scan

      - name: 🔎 Grype scan
        id: scan
        uses: anchore/scan-action@v4
        with:
          image: greydns:scan
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      - name: ⬆️ Upload SARIF
        if: always() && steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype
